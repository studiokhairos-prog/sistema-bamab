<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>BAMAB — Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#33230d,#090909 46%,#020202);color:#eee;font-family:Arial,sans-serif}.card{width:min(480px,100%);padding:28px;border:1px solid #ad8130;border-radius:20px;background:#0c0c0eee;box-shadow:0 25px 70px #000;text-align:center}.card img{width:128px;height:128px;object-fit:contain;filter:drop-shadow(0 10px 18px #000)}h1{margin:12px 0 8px;color:#e5b951;font:800 32px Georgia,serif}p{margin:0;color:#c8c2b6;line-height:1.55}.note{margin:18px 0;padding:12px;border-left:4px solid #c99a34;background:#15130e;color:#ead9ad;text-align:left;font-size:13px}button{width:100%;min-height:46px;border:1px solid #c99a34;border-radius:10px;background:#70180f;color:#fff;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/icons/icon-192.png" alt="Brasão BAMAB">
    <h1>Você está sem conexão</h1>
    <p>O aplicativo BAMAB está instalado, mas esta página precisa de internet para carregar informações atualizadas.</p>
    <div class="note">Por segurança, matrículas, área administrativa, instrutores e dados pessoais nunca ficam armazenados para uso offline.</div>
    <button type="button" onclick="location.reload()">TENTAR NOVAMENTE</button>
  </main>
</body>
</html>
